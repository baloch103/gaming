<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw Profit - ProfitInvest PKR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white font-sans">

  <header class="p-5 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-emerald-400">ProfitInvest PKR</h1>
    <div class="space-x-4">
      <a href="dashboard.html" class="text-slate-300 hover:text-emerald-400 text-sm font-semibold">Dashboard</a>
      <a href="index.html" class="text-slate-300 hover:text-emerald-400 text-sm font-semibold">Packages</a>
      <a href="history.html" class="text-slate-300 hover:text-emerald-400 text-sm font-semibold">History</a>
      <button onclick="logout()" class="bg-rose-600 hover:bg-rose-500 px-3 py-1 rounded text-xs">Logout</button>
    </div>
  </header>

  <main class="max-w-md mx-auto mt-12 p-4">
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-2xl">
      <h3 class="text-2xl font-bold text-emerald-400 mb-4 border-b border-slate-700 pb-2">Request Withdrawal (رقم ڪڍڻ)</h3>
      
      <form onsubmit="handleWithdrawSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">Payment Gateway</label>
          <select id="withdraw-method" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
            <option value="Easypaisa">Easypaisa</option>
            <option value="JazzCash">JazzCash</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">Account Title (نالو)</label>
          <input type="text" id="withdraw-title" required placeholder="e.g. Ali Raza" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">Account Number (نمبر)</label>
          <input type="text" id="withdraw-number" required placeholder="e.g. 03001234567" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">Withdraw Amount (PKR)</label>
          <input type="number" id="withdraw-amount" min="100" required placeholder="Min 100 PKR" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
        </div>
        
        <button type="submit" id="withdraw-submit-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 py-2.5 rounded-lg font-semibold transition">Submit Withdrawal Request</button>
      </form>
    </div>
  </main>

  <script>
    const _supabase = supabase.createClient('https://rrinvfjkvepclqesxaox.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyaW52ZmprdmVwY2xxZXN4YW94Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNjg5MTMsImV4cCI6MjEwMzY0NDkxM30.5DRZBsF_k21AJE0SXf_p_gSSsR30FW0H-qm2aWQ4pb8');
    let currentUser = null;

    async function checkAuth() {
      const { data: { user } } = await _supabase.auth.getUser();
      if (!user) window.location.href = 'index.html';
      else currentUser = user;
    }
    checkAuth();

    async function handleWithdrawSubmit(e) {
      e.preventDefault();
      const method = document.getElementById('withdraw-method').value;
      const title = document.getElementById('withdraw-title').value.trim();
      const number = document.getElementById('withdraw-number').value.trim();
      const amount = document.getElementById('withdraw-amount').value;

      const { error } = await _supabase.from('user_withdrawals').insert([{
        user_name: currentUser.email, payment_method: method, account_title: title,
        account_number: number, amount_pkr: Number(amount), status: 'Pending'
      }]);

      if (error) alert(error.message);
      else { alert("Withdrawal request submitted!"); window.location.href = 'history.html'; }
    }

    async function logout() { await _supabase.auth.signOut(); window.location.href = 'index.html'; }
  </script>
</body>
</html>
