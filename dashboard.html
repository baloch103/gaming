<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ProfitInvest PKR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white font-sans">

  <header class="p-5 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-emerald-400">ProfitInvest PKR</h1>
    <div class="space-x-4">
      <a href="index.html" class="text-slate-300 hover:text-emerald-400 text-sm font-semibold">Packages</a>
      <a href="withdraw.html" class="text-slate-300 hover:text-emerald-400 text-sm font-semibold">Withdraw</a>
      <a href="history.html" class="text-slate-300 hover:text-emerald-400 text-sm font-semibold">History</a>
      <button onclick="logout()" class="bg-rose-600 hover:bg-rose-500 px-3 py-1 rounded text-xs">Logout</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto mt-12 px-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-xl flex flex-col md:flex-row justify-between items-center gap-6">
      <div>
        <p class="text-xs text-slate-400 uppercase font-semibold">Available Net Balance</p>
        <h3 id="user-balance" class="text-4xl font-extrabold text-emerald-400 mt-2">PKR 0</h3>
        <p class="text-xs text-slate-500 mt-1" id="balance-details">Loading calculations...</p>
      </div>
      <div class="flex gap-4">
        <a href="index.html" class="bg-slate-700 hover:bg-slate-600 px-5 py-3 rounded-lg text-sm font-bold">➕ Deposit</a>
        <a href="withdraw.html" class="bg-emerald-500 hover:bg-emerald-600 px-5 py-3 rounded-lg text-sm font-bold">💸 Withdraw</a>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://rrinvfjkvepclqesxaox.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyaW52ZmprdmVwY2xxZXN4YW94Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNjg5MTMsImV4cCI6MjEwMzY0NDkxM30.5DRZBsF_k21AJE0SXf_p_gSSsR30FW0H-qm2aWQ4pb8';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    async function initDashboard() {
      const { data: { user } } = await _supabase.auth.getUser();
      if (!user) { 
        window.location.href = 'index.html'; 
        return; 
      }

      // 1. Fetch Approved Investments (ڪمايل رقم)
      const { data: investments } = await _supabase
        .from('user_investments')
        .select('*')
        .eq('user_name', user.email);

      let totalEarned = 0;
      const now = new Date().getTime();

      if (investments) {
        investments.forEach(item => {
          if (item.status === 'Approved') {
            const daysPassed = Math.floor((now - new Date(item.created_at).getTime()) / (1000 * 60 * 60 * 24));
            const activeDays = Math.min(Math.max(daysPassed, 1), 60);
            totalEarned += Number(item.daily_profit || 0) * activeDays;
          }
        });
      }

      // 2. Fetch Approved Withdrawals (ڪڍرايل رقم)
      const { data: withdrawals } = await _supabase
        .from('user_withdrawals')
        .select('*')
        .eq('user_name', user.email);

      let totalWithdrawn = 0;

      if (withdrawals) {
        withdrawals.forEach(item => {
          // صرف منظور (Approved) يا پروسيس ٿيل ويٿڊرا مائنس ٿيندو
          if (item.status === 'Approved') {
            totalWithdrawn += Number(item.amount_pkr || 0);
          }
        });
      }

      // 3. Final Calculation (باقي بئلينس = ڪل منافعو - ويٿڊرا)
      const netBalance = totalEarned - totalWithdrawn;

      document.getElementById('user-balance').innerText = `PKR ${netBalance.toLocaleString()}`;
      document.getElementById('balance-details').innerText = `Total Earned: PKR ${totalEarned} | Total Withdrawn: PKR ${totalWithdrawn}`;
    }

    initDashboard();

    async function logout() { 
      await _supabase.auth.signOut(); 
      window.location.href = 'index.html'; 
    }
  </script>
</body>
</html>
